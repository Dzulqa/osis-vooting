server {
    listen 80;
    server_name suara.smkalamanah.sch.id;

    # Optional: redirect HTTP to HTTPS (uncomment when you have SSL configured)
    # return 301 https://$host$request_uri;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets never change: let browsers and nginx cache them for a year
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # Forward requests to PM2 Next.js server running on port 3008
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

